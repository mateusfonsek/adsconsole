<!doctype html>
<!--
  Template da página de retorno do login da Meta.

  Com o app da Meta publicado (modo Ativo), a Meta não aceita localhost como retorno do
  login. Publique esta página num endereço https seu (por exemplo
  https://seu-site.com/oauth/meta/), cadastre o endereço em "URIs de redirecionamento do
  OAuth válidos" do app e passe-o em `meta_connect ... --relay <url>`.

  A página só devolve o navegador para o AdsConsole no seu computador. Troque
  {{URL_PRIVACIDADE}} pela URL da sua política de privacidade e apague este comentário.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Voltando ao AdsConsole</title>
    <style>
      :root { --bg: #0c0c0c; --fg: #e8e8e6; --muted: #9a9a96; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #fafaf8; --fg: #1a1a18; --muted: #5f5f5a; }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
      p.small { color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Voltando ao AdsConsole…</h1>
      <p id="msg">Repassando o login da Meta ao AdsConsole no seu computador.</p>
      <p class="small">
        Esta página só devolve o navegador para <code>localhost</code>, onde o AdsConsole
        está esperando. Nada é guardado nem enviado a outro lugar.
        <a href="{{URL_PRIVACIDADE}}">Política de privacidade</a>.
      </p>
    </main>
    <script>
      // O AdsConsole manda a porta local no state: "<porta>.<aleatório>".
      (function () {
        var params = new URLSearchParams(window.location.search);
        var state = params.get("state") || "";
        var match = /^(\d{1,5})\.[A-Za-z0-9]+$/.exec(state);
        var port = match ? Number(match[1]) : 0;
        if (port < 1 || port > 65535) {
          document.getElementById("title").textContent = "Não deu para voltar ao AdsConsole";
          document.getElementById("msg").textContent =
            "Este endereço não veio de um login do AdsConsole. Volte ao app e tente conectar de novo.";
          return;
        }
        window.location.replace(
          "http://localhost:" + port + "/callback" + window.location.search
        );
      })();
    </script>
  </body>
</html>
