<!doctype html>
<!--
  Template for the Meta login return page.

  With the Meta app published (Live mode), Meta does not accept localhost as the login
  return address. Publish this page at an https address of yours (for example
  https://your-site.com/oauth/meta/), add the address to the app's "Valid OAuth Redirect
  URIs" and pass it to `meta_connect ... --relay <url>`.

  The page only sends the browser back to AdsConsole on your computer. Replace
  {{PRIVACY_URL}} with the URL of your privacy policy and delete this comment.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Returning to AdsConsole</title>
    <style>
      :root { --bg: #0c0c0c; --fg: #e8e8e6; --muted: #9a9a96; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #fafaf8; --fg: #1a1a18; --muted: #5f5f5a; }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
      p.small { color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Returning to AdsConsole…</h1>
      <p id="msg">Handing the Meta login over to AdsConsole on your computer.</p>
      <p class="small">
        This page only sends the browser back to <code>localhost</code>, where AdsConsole
        is waiting. Nothing is stored or sent anywhere else.
        <a href="{{PRIVACY_URL}}">Privacy policy</a>.
      </p>
    </main>
    <script>
      // AdsConsole sends the local port in state: "<port>.<random>".
      (function () {
        var params = new URLSearchParams(window.location.search);
        var state = params.get("state") || "";
        var match = /^(\d{1,5})\.[A-Za-z0-9]+$/.exec(state);
        var port = match ? Number(match[1]) : 0;
        if (port < 1 || port > 65535) {
          document.getElementById("title").textContent = "Could not return to AdsConsole";
          document.getElementById("msg").textContent =
            "This address did not come from an AdsConsole login. Go back to the app and try connecting again.";
          return;
        }
        window.location.replace(
          "http://localhost:" + port + "/callback" + window.location.search
        );
      })();
    </script>
  </body>
</html>
